<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SleekChat - Real-Time Chat App</title>
    <!-- Google Fonts: Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        
        <!-- ==================== AUTH CONTAINER ==================== -->
        <div id="auth-container" class="glass-card auth-card">
            <div class="auth-header">
                <div class="logo-icon"><i class="fa-solid fa-comments-dollar"></i></div>
                <h1 class="brand-title">SleekChat</h1>
                <p id="auth-subtitle">Welcome back! Please enter your details.</p>
            </div>
            
            <form id="auth-form">
                <div class="input-group">
                    <label for="username"><i class="fa-solid fa-user"></i> Username</label>
                    <input type="text" id="username" placeholder="e.g. alex_stone" required autocomplete="off">
                </div>
                
                <div class="input-group">
                    <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                
                <div id="auth-error-msg" class="error-msg hidden"></div>
                
                <button type="submit" id="auth-submit-btn" class="btn primary-btn">
                    <span>Log In</span> <i class="fa-solid fa-right-to-bracket"></i>
                </button>
            </form>
            
            <div class="auth-footer">
                <span id="auth-toggle-text">Don't have an account?</span>
                <a href="#" id="auth-toggle-link">Sign Up</a>
            </div>
        </div>

        <!-- ==================== CHAT CONTAINER ==================== -->
        <div id="chat-container" class="glass-card chat-card hidden">
            <!-- Sidebar -->
            <aside class="chat-sidebar">
                <div class="sidebar-header">
                    <div class="logo-area">
                        <i class="fa-solid fa-comments-dollar"></i>
                        <span>SleekChat</span>
                    </div>
                </div>
                
                <div class="user-profile">
                    <div class="avatar">
                        <i class="fa-solid fa-circle-user"></i>
                    </div>
                    <div class="user-details">
                        <h3 id="current-username">Guest</h3>
                        <span class="status-indicator-text"><span class="status-dot online"></span> Online</span>
                    </div>
                </div>

                <div class="sidebar-rooms">
                    <div id="lobby-link" class="room-item active">
                        <i class="fa-solid fa-earth-americas text-primary"></i>
                        <span>Global Lobby</span>
                    </div>
                </div>

                <div class="sidebar-menu-title">
                    <span>Online Members (<span id="user-count">0</span>)</span>
                </div>

                <!-- Online users list -->
                <div class="users-list" id="users-list">
                    <!-- Loaded dynamically in app.js -->
                </div>
                
                <div class="sidebar-footer">
                    <button id="logout-btn" class="btn secondary-btn">
                        <i class="fa-solid fa-power-off"></i> <span>Log Out</span>
                    </button>
                </div>
            </aside>

            <!-- Main Chat Area -->
            <main class="chat-main">
                <header class="chat-header">
                    <button id="mobile-back-btn" class="btn back-btn" title="Back to User List">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    <div class="header-info">
                        <h2>Global Lobby</h2>
                        <p>Talk with anyone online in real-time</p>
                    </div>
                    <div class="header-actions">
                        <span class="ws-status" id="ws-status">
                            <span class="status-dot offline" id="ws-status-dot"></span>
                            <span id="ws-status-text">Disconnected</span>
                        </span>
                    </div>
                </header>

                <!-- Message Feed -->
                <div class="chat-messages" id="chat-messages">
                    <!-- Message list loaded dynamically in app.js -->
                </div>

                <!-- Typing indicator -->
                <div id="typing-indicator" class="typing-indicator hidden">
                    <span class="dots"><span></span><span></span><span></span></span>
                    <span id="typing-text">Someone is typing...</span>
                </div>

                <!-- Chat Input form -->
                <form id="chat-form" class="chat-input-area">
                    <input type="text" id="message-input" placeholder="Type a message..." required autocomplete="off">
                    <button type="submit" class="btn send-btn">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </form>
            </main>
        </div>

    </div>

    <!-- SockJS and STOMP Clients -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <!-- App JavaScript Logic -->
    <script src="app.js"></script>
</body>
</html>
