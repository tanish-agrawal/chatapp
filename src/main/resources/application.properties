spring.application.name=chat

# Database Configuration (Defaults to local H2, overridden by environment variables in cloud deployment)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/chatdb;DB_CLOSE_DELAY=-1}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA/Hibernate (Uses PostgreSQL dialect if deployed to cloud, H2 dialect locally)
spring.jpa.database-platform=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (Disabled in production unless explicitly set, active locally)
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Security JWT Properties (Dynamic environment key in production, fallback locally)
jwt.secret=${JWT_SECRET:9a62aa5f3c9d74f26b528b97c8cfbc72b2170ba62908f2fb289bb661642841cf}
jwt.expiration=36000000

# Server Port (Fall back to 8080 if the cloud environment PORT variable is not defined)
server.port=${PORT:8080}
